<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sky-brain</title>
    <!-- An installable web app, so iPhones can get approval alerts (D36). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <script src="/theme-init.js"></script>
    <!-- The 3D brain beside the name in the header; the server serves it with the sign-in page. -->
    <script src="/auth-pages/brain.js" defer></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
